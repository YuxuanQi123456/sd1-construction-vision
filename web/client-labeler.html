<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>甲方视频 · 帽衣补充标注</title>
  <link rel="stylesheet" href="/web/client-labeler.css">
</head>
<body>
<header><h1>甲方视频 · 帽衣补充标注</h1><p>原图本地读写 · 人员标签保留 · 先选类别，再拖框；看不清的装备不硬标</p></header>
<main>
  <section class="card">
    <div class="toolbar">
      <button id="reload">重新加载</button><button id="prev" disabled>上一张 A</button>
      <select id="image-select" aria-label="选择图片" disabled></select><button id="next" disabled>下一张 D</button>
      <button id="save" class="primary" disabled>保存 S</button>
      <button id="complete" disabled>本帧帽衣标完，下一张</button>
      <button id="export" disabled>下载当前标签草稿</button><button id="discard" disabled>放弃未保存修改并重读</button>
    </div>
    <div id="status" role="status">正在读取本地标注包…</div>
  </section>
  <section class="card controls">
    <div class="toolbar">
      <label>新框类别 <select id="class-select" disabled></select></label>
      <button id="helmet" disabled>安全帽 H</button><button id="vest" disabled>反光衣 V</button>
      <label><input id="hide-person" type="checkbox" checked>隐藏人员框</label>
      <label><input id="current-only" type="checkbox">只看当前类别</label>
      <label><input id="show-names" type="checkbox">显示框名</label>
      <button id="original" disabled>按住看无框原图 X</button>
    </div>
    <div class="toolbar">
      <label>放大 <input id="zoom" type="range" min="5" max="1000" value="100" step="5" disabled><span id="zoom-value">100%</span></label>
      <button id="fit" disabled>适应窗口</button>
      <select id="person-focus" aria-label="定位已标注人员" disabled></select><button id="focus" disabled>居中放大此人</button>
      <span class="muted">空格＋拖动平移；H 帽 / V 衣；Delete 删除选中框</span>
    </div>
  </section>
  <div class="workspace">
    <section class="card canvas-card"><div id="canvas-wrap"><canvas id="canvas" width="1" height="1"></canvas></div></section>
    <aside class="card">
      <p id="counts">0 张图片</p><p id="coverage" class="muted">帽衣标注尚未确认</p>
      <p class="muted">隐藏只是显示设置，保存时会保留所有类别。人员框不需要重画。</p>
      <div id="boxes"></div>
      <div class="note">安全帽只框帽子；反光衣只框上身反光衣。人太小或被挡住时先跳过，不把“看不清”标成未佩戴。</div>
      <button id="undo" disabled>撤销最近修改</button>
    </aside>
  </div>
</main>
<script src="/web/client-labeler.js"></script>
</body>
</html>
